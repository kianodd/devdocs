<blockquote>
<p><strong>LocalsNotAnObject</strong>: <code>locals</code> can only be assigned to an object. Other values like numbers, strings, etc. are not accepted.</p>
</blockquote>
<h2 id="what-went-wrong">What went wrong?</h2>
<p>Thrown when <code>locals</code> is overwritten with something that is not an object</p>
