<p>More than one protection modifier</p>
<p>Only one access modifier (<a href="#/doc/csharp/language-reference/keywords/public">public</a>, <a href="#/doc/csharp/language-reference/keywords/private">private</a>, <a href="#/doc/csharp/language-reference/keywords/protected">protected</a>, or <a href="#/doc/csharp/language-reference/keywords/internal">internal</a>) is allowed on a class member, with the exception of <a href="#/doc/csharp/language-reference/keywords/protected-internal"><strong>protected internal</strong></a> and <a href="#/doc/csharp/language-reference/keywords/private-protected"><strong>private protected</strong></a>.</p>
