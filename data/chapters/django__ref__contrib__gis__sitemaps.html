<p>KML is an XML language focused on geographic visualization<a target="_blank" rel="noopener" href="https://www.ogc.org/standard/kml/">^1</a>. <code>KMLSitemap</code> and its compressed counterpart <code>KMZSitemap</code> allow you to present geolocated data in a machine-readable format.</p>
