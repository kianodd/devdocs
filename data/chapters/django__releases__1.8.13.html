<p><em>May 2, 2016</em></p>
<p>Django 1.8.13 fixes several bugs in 1.8.12.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Fixed <code>TimeField</code> microseconds round-tripping on MySQL and SQLite ([26498]).</li>
<li>Restored conversion of an empty string to null when saving values of <code>GenericIPAddressField</code> on SQLite and MySQL ([26557]).</li>
</ul>
