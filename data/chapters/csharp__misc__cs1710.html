<p>XML comment on &#39;type&#39; has a duplicate typeparam tag for &#39;parameter&#39;  </p>
<p> The documentation of a generic type includes a duplicate tag for the type parameter.  </p>
<h2 id="example">Example</h2>
<p> The following code will cause warning CS1710 to appear.  </p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Code</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-plaintext">// CS1710.cs  
// compile with: /doc:cs1710.xml  
// To resolve this warning, delete one of the duplicate &lt;typeparam&gt;&#x27;s.  
using System;  
class Stack  
{  
}  
  
/// &lt;typeparam name=&quot;MyType&quot;&gt;can be an int&lt;/typeparam&gt;  
/// &lt;typeparam name=&quot;MyType&quot;&gt;can be an int&lt;/typeparam&gt;  
class MyStackWrapper  
{  
    // Open constructed type Stack.  
    Stack stack;  
    public MyStackWrapper(Stack s)  
    {  
        stack = s;  
    }  
}  
  
class CMain  
{  
    public static void Main()  
    {  
        // Closed constructed type Stack&lt;int&gt;.  
        Stack&lt;int&gt; stackInt = new Stack&lt;int&gt;();  
        MyStackWrapper&lt;int&gt; MyStackWrapperInt =  
            new MyStackWrapper&lt;int&gt;(stackInt);  
    }  
}  </code></pre></div></figure>
