<p><em>May 13, 2021</em></p>
<p>Django 3.1.11 fixes a regression in 3.1.9.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Fixed a regression in Django 3.1.9 where saving <code>FileField</code> would raise a <code>SuspiciousFileOperation</code> even when a custom [~django.db.models.FileField.upload_to] returns a valid file path ([32718]).</li>
</ul>
