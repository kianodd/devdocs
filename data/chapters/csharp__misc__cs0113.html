<p>A member &#39;function&#39; marked as override cannot be marked as new or virtual  </p>
<p> It is mutually exclusive to mark a method with the <a href="#/doc/csharp/language-reference/keywords/new-modifier">new</a> and <a href="#/doc/csharp/language-reference/keywords/override">override</a> keywords.  </p>
