<p>pg_xlogdump</p>
<p>pg_waldump</p>
<p>PostgreSQL 9.6 and below provided a command named <code>pg_xlogdump</code> []{.indexterm} to read write-ahead-log (WAL) files. This command was renamed to <code>pg_waldump</code>, see <a href="#pgwaldump">???</a> for documentation of <code>pg_waldump</code> and see <a href="#release-prior">the release notes for PostgreSQL 10</a> for details on this change.</p>
