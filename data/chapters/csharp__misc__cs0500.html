<p>&#39;class member&#39; cannot declare a body because it is marked abstract  </p>
<p> An <a href="#/doc/csharp/language-reference/keywords/abstract">abstract</a> method cannot contain its implementation.  </p>
<p> The following sample generates CS0500:  </p>
