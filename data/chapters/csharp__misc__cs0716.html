<p>Cannot convert to static type &#39;type&#39;  </p>
<p> This error occurs if your code uses a cast to convert to a static type. Since it is not possible for an object to be an instance of a static type, casting to a static type can never be a meaningful cast.  </p>
<h2 id="example">Example</h2>
<p> The following sample generates CS0716:  </p>
