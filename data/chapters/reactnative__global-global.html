<p><a target="_blank" rel="noopener" href="https://nodejs.org/api/globals.html#global"><code>global</code></a> is a legacy alias for <a target="_blank" rel="noopener" href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/globalThis"><code>globalThis</code></a>, as defined in Node.js.</p>
<p>The use of <code>globalThis</code> is recommended over <code>global</code>.</p>
