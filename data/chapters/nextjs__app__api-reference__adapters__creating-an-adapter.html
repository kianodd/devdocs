<p>An adapter is a module that exports an object implementing the <code>NextAdapter</code> interface.</p>
<p>The interface can be imported from the <code>next</code> package:</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>TypeScript</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript"></code></pre></div></figure>
<p>The interface is defined as follows:</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>TypeScript</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript"><span class="hljs-keyword">type</span> <span class="hljs-title class_">Route</span> = {
  <span class="hljs-attr">source</span>?: <span class="hljs-built_in">string</span>
  <span class="hljs-attr">sourceRegex</span>: <span class="hljs-built_in">string</span>

  <span class="hljs-attr">headers</span>?: <span class="hljs-title class_">Record</span>&lt;<span class="hljs-built_in">string</span>, <span class="hljs-built_in">string</span>&gt;

  <span class="hljs-attr">missing</span>?: <span class="hljs-title class_">RouteHas</span>[]
  <span class="hljs-attr">status</span>?: <span class="hljs-built_in">number</span>
  <span class="hljs-attr">priority</span>?: <span class="hljs-built_in">boolean</span>
}

  <span class="hljs-attr">pages</span>: <span class="hljs-title class_">Array</span>&lt;<span class="hljs-title class_">AdapterOutput</span>[<span class="hljs-string">&#x27;PAGES&#x27;</span>]&gt;
  <span class="hljs-attr">middleware</span>?: <span class="hljs-title class_">AdapterOutput</span>[<span class="hljs-string">&#x27;MIDDLEWARE&#x27;</span>]
  <span class="hljs-attr">appPages</span>: <span class="hljs-title class_">Array</span>&lt;<span class="hljs-title class_">AdapterOutput</span>[<span class="hljs-string">&#x27;APP_PAGE&#x27;</span>]&gt;
  <span class="hljs-attr">pagesApi</span>: <span class="hljs-title class_">Array</span>&lt;<span class="hljs-title class_">AdapterOutput</span>[<span class="hljs-string">&#x27;PAGES_API&#x27;</span>]&gt;
  <span class="hljs-attr">appRoutes</span>: <span class="hljs-title class_">Array</span>&lt;<span class="hljs-title class_">AdapterOutput</span>[<span class="hljs-string">&#x27;APP_ROUTE&#x27;</span>]&gt;
  <span class="hljs-attr">prerenders</span>: <span class="hljs-title class_">Array</span>&lt;<span class="hljs-title class_">AdapterOutput</span>[<span class="hljs-string">&#x27;PRERENDER&#x27;</span>]&gt;
  <span class="hljs-attr">staticFiles</span>: <span class="hljs-title class_">Array</span>&lt;<span class="hljs-title class_">AdapterOutput</span>[<span class="hljs-string">&#x27;STATIC_FILE&#x27;</span>]&gt;
}

  <span class="hljs-attr">name</span>: <span class="hljs-built_in">string</span>

    <span class="hljs-attr">config</span>: <span class="hljs-title class_">NextConfigComplete</span>,

  <span class="hljs-attr">onBuildComplete</span>?: <span class="hljs-function">(<span class="hljs-params"><span class="hljs-attr">ctx</span>: {
    routing: {
      beforeMiddleware: <span class="hljs-built_in">Array</span>

      dynamicRoutes: <span class="hljs-built_in">Array</span>

}</code></pre></div></figure>
<h2 id="basic-adapter-structure">Basic Adapter Structure</h2>
<p>Here&#39;s a minimal adapter example:</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>my-adapter.js</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-javascript"><span class="hljs-comment">/** <span class="hljs-doctag">@type</span> {<span class="hljs-type">import(&#x27;next&#x27;).NextAdapter</span>} */</span>
<span class="hljs-keyword">const</span> adapter = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&#x27;my-custom-adapter&#x27;</span>,

  <span class="hljs-keyword">async</span> <span class="hljs-title function_">modifyConfig</span>(<span class="hljs-params">config, { phase }</span>) {
    <span class="hljs-comment">// Modify the Next.js config based on the build phase</span>
    <span class="hljs-keyword">if</span> (phase === <span class="hljs-string">&#x27;phase-production-build&#x27;</span>) {
      <span class="hljs-keyword">return</span> {
        ...config,
        <span class="hljs-comment">// Add your modifications</span>
      }
    }
    <span class="hljs-keyword">return</span> config
  },

  <span class="hljs-keyword">async</span> <span class="hljs-title function_">onBuildComplete</span>(<span class="hljs-params">{
    routing,
    outputs,
    projectDir,
    repoRoot,
    distDir,
    config,
    nextVersion,
    buildId,
  }</span>) {
    <span class="hljs-comment">// Process the build output</span>
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Build completed with&#x27;</span>, outputs.<span class="hljs-property">pages</span>.<span class="hljs-property">length</span>, <span class="hljs-string">&#x27;pages&#x27;</span>)
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Build ID:&#x27;</span>, buildId)
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Dynamic routes:&#x27;</span>, routing.<span class="hljs-property">dynamicRoutes</span>.<span class="hljs-property">length</span>)

    <span class="hljs-comment">// Access emitted output entries</span>
    <span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> page <span class="hljs-keyword">of</span> outputs.<span class="hljs-property">pages</span>) {
      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Page:&#x27;</span>, page.<span class="hljs-property">pathname</span>, <span class="hljs-string">&#x27;at&#x27;</span>, page.<span class="hljs-property">filePath</span>)
    }

    <span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> apiRoute <span class="hljs-keyword">of</span> outputs.<span class="hljs-property">pagesApi</span>) {
      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;API Route:&#x27;</span>, apiRoute.<span class="hljs-property">pathname</span>, <span class="hljs-string">&#x27;at&#x27;</span>, apiRoute.<span class="hljs-property">filePath</span>)
    }

    <span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> appPage <span class="hljs-keyword">of</span> outputs.<span class="hljs-property">appPages</span>) {
      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;App Page:&#x27;</span>, appPage.<span class="hljs-property">pathname</span>, <span class="hljs-string">&#x27;at&#x27;</span>, appPage.<span class="hljs-property">filePath</span>)
    }

    <span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> prerender <span class="hljs-keyword">of</span> outputs.<span class="hljs-property">prerenders</span>) {
      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Prerendered:&#x27;</span>, prerender.<span class="hljs-property">pathname</span>)
    }
  },
}

<span class="hljs-variable language_">module</span>.<span class="hljs-property">exports</span> = adapter</code></pre></div></figure>
