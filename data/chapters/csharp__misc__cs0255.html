<p>stackalloc may not be used in a catch or finally block  </p>
<p>You cannot use the <a href="#/doc/csharp/language-reference/operators/stackalloc">stackalloc operator</a> in a <a href="#/doc/csharp/language-reference/statements/exception-handling-statements@the-try-catch-statement">catch</a> or <a href="#/doc/csharp/language-reference/statements/exception-handling-statements@the-try-finally-statement">finally</a> block. For more information, see <a href="#/doc/csharp/fundamentals/exceptions/index">Exceptions and Exception Handling</a>.  </p>
