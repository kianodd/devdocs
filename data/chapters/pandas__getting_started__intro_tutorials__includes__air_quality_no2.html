<p>For this tutorial, air quality data about [NO_2] is used, made available by <a target="_blank" rel="noopener" href="https://openaq.org">OpenAQ</a> and using the <a target="_blank" rel="noopener" href="http://dhhagan.github.io/py-openaq/index.html">py-openaq</a> package. The <code>air_quality_no2.csv</code> data set provides [NO_2] values for the measurement stations <em>FR04014</em>, <em>BETR801</em> and <em>London Westminster</em> in respectively Paris, Antwerp and London.</p>
