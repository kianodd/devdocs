<p>&#39;class1&#39; : cannot derive from sealed type &#39;class2&#39;  </p>
<p> A <a href="#/doc/csharp/language-reference/keywords/sealed">sealed</a> class cannot act as a <a href="#/doc/csharp/language-reference/keywords/base">base</a> class. Structs are sealed by default.  </p>
