<p>Next.js comes with <strong>two</strong> Command Line Interface (CLI) tools:</p>
<ul>
<li><strong><code>create-next-app</code></strong>: Quickly create a new Next.js application using the default template or an <a target="_blank" rel="noopener" href="https://github.com/vercel/next.js/tree/canary/examples">example</a> from a public GitHub repository.</li>
<li><strong><code>next</code></strong>: Run the Next.js development server, build your application, and more.</li>
</ul>
