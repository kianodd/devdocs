<p><em>October 1, 2019</em></p>
<p>Django 2.1.13 fixes a regression in 2.1.11.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Fixed a crash when filtering with a <code>Subquery()</code> annotation of a queryset containing <code>django.contrib.postgres.fields.JSONField</code> or [~django.contrib.postgres.fields.HStoreField] ([30769]).</li>
</ul>
