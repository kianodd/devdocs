<p>Using <code>EntityManager</code> you can manage (insert, update, delete, load, etc.) any entity.
EntityManager is just like a collection of all entity repositories in a single place.</p>
<p>You can access the entity manager via DataSource.
Example how to use it:</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>TypeScript</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript">


<span class="hljs-keyword">const</span> myDataSource = <span class="hljs-keyword">new</span> <span class="hljs-title class_">DataSource</span>(<span class="hljs-comment">/*...*/</span>)
<span class="hljs-keyword">const</span> user = <span class="hljs-keyword">await</span> myDataSource.<span class="hljs-property">manager</span>.<span class="hljs-title function_">findOneBy</span>(<span class="hljs-title class_">User</span>, {
    <span class="hljs-attr">id</span>: <span class="hljs-number">1</span>,
})
user.<span class="hljs-property">name</span> = <span class="hljs-string">&quot;Umed&quot;</span>
<span class="hljs-keyword">await</span> myDataSource.<span class="hljs-property">manager</span>.<span class="hljs-title function_">save</span>(user)</code></pre></div></figure>
