<p>The <code>require_once</code> expression is identical to <code>require</code> except PHP will check if the file has already been included, and if so, not include (require) it again.</p>
<p>See the <code>include_once</code> documentation for information about the <code>_once</code> behaviour, and how it differs from its non <code>_once</code> siblings.</p>
