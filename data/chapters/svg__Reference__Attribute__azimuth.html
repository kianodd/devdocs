<p>The <strong><code>azimuth</code></strong> attribute specifies the direction angle for the light source on the XY plane (clockwise), in degrees from the x axis.</p>
<p>You can use this attribute with the following SVG elements:</p>
<ul>
<li><code>feDistantLight</code></li>
</ul>
