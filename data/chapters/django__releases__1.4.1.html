<p><em>July 30, 2012</em></p>
<p>This is the first security release in the Django 1.4 series, fixing several security issues in Django 1.4. Django 1.4.1 is a recommended upgrade for all users of Django 1.4.</p>
<p>For a full list of issues addressed in this release, see the <a target="_blank" rel="noopener" href="https://www.djangoproject.com/weblog/2012/jul/30/security-releases-issued/">security advisory</a>.</p>
