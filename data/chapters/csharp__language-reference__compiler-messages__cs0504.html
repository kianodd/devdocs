<p>The constant &#39;variable&#39; cannot be marked static  </p>
<p> If a variable is <a href="#/doc/csharp/language-reference/keywords/const">const</a>, it is also <a href="#/doc/csharp/language-reference/keywords/static">static</a>. If you want a <strong>const</strong> and <strong>static</strong> variable, just declare that variable as <strong>const</strong>; if all you want is a <strong>static</strong> variable, just mark it <strong>static</strong>.  </p>
<p> The following sample generates CS0504:  </p>

{  
   abstract public class clx

   }  
}  </code></pre></div></figure>
