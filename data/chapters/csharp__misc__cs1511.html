<p>Keyword &#39;base&#39; is not available in a static method  </p>
<p> The <a href="#/doc/csharp/language-reference/keywords/base">base</a> keyword was used in a <a href="#/doc/csharp/language-reference/keywords/static">static</a> method. <code>base</code> can only be called in an instance constructor, instance method, or instance accessor.  </p>
<h2 id="example">Example</h2>
<p> The following sample generates CS1511.  </p>

}

{
