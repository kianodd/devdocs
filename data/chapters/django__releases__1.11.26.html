<p><em>November 4, 2019</em></p>
<p>Django 1.11.26 fixes a regression in 1.11.25.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Fixed a crash when using a <code>contains</code>, <code>contained_by</code>, <code>has_key</code>, <code>has_keys</code>, or <code>has_any_keys</code> lookup on <code>django.contrib.postgres.fields.JSONField</code>, if the right or left hand side of an expression is a key transform ([30826]).</li>
</ul>
