<p>Cannot link resource file &#39;file&#39; when building a module  </p>
<p> <a href="#/doc/csharp/language-reference/compiler-options/resources@linkresource"><strong>/linkresource</strong></a> was used in the same compilation with the <strong>module</strong> option on the <a href="#/doc/csharp/language-reference/compiler-options/output@outputtype"><strong>OutputType</strong></a>, which is not allowed. For example, the following options would generate CS1507:  </p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Terminal</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-bash"><span class="tk-cmd">csc</span> /linkresource:rf.resource /target:module in.cs  </code></pre></div></figure>
<p> Embedding resources (<a href="#/doc/csharp/language-reference/compiler-options/resources@embeddedresource"><strong>EmbeddedResource</strong></a>), however, is allowed.</p>
