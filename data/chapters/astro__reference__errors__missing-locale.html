<blockquote>
<p><strong>MissingLocale</strong>: The locale/path <code>LOCALE</code> does not exist in the configured <code>i18n.locales</code>.</p>
</blockquote>
<h2 id="what-went-wrong">What went wrong?</h2>
<p>Astro can&#39;t find the requested locale. All supported locales must be configured in <a href="#/doc/astro/reference/configuration-reference@i18nlocales"><code>i18n.locales</code></a> and have corresponding directories within <code>src/pages/</code>.</p>
