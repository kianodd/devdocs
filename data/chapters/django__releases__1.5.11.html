<p><em>October 22, 2014</em></p>
<p>Django 1.5.11 fixes a couple regressions in the 1.5.9 security release.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Allowed related many-to-many fields to be referenced in the admin ([23604]).</li>
<li>Allowed inline and hidden references to admin fields ([23431]).</li>
</ul>
