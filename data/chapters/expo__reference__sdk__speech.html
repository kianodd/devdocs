<p><code>expo-speech</code> provides an API that allows you to utilize Text-to-speech functionality in your app.</p>
<blockquote>
<p><strong>info</strong> On iOS physical devices, <code>expo-speech</code> won&#39;t produce sound if the device is in silent mode. Make sure silent mode is turned off.</p>
</blockquote>
