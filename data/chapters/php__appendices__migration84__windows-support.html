<h2 id="core">Core</h2>
<p>Building with Visual Studio now requires at least Visual Studio 2019. However, Visual Studio 2022 is recommended.</p>
<p>AVX(2) CPU support is now properly detected for MSVC builds.</p>
<p>Native AVX-512 builds are now supported via the <code>--enable-native-intrinsics=avx512</code> configure option.</p>
