<p><em>February 5, 2025</em></p>
<p>Django 5.0.12 fixes a regression in 5.0.11.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Fixed a regression in Django 5.0.11 that caused <code>validate_ipv6_address()</code> and <code>validate_ipv46_address()</code> to crash when handling non-string values ([36098]).</li>
</ul>
