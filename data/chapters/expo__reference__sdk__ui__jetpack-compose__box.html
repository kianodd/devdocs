<p>Expo UI Box matches the official Jetpack Compose <a target="_blank" rel="noopener" href="https://developer.android.com/reference/kotlin/androidx/compose/foundation/layout/package-summary#Box">Box</a> API and stacks children on top of each other with configurable content alignment.</p>
<h2 id="installation">Installation</h2>
<h2 id="usage">Usage</h2>
<p><code>Box</code> stacks children on top of each other. Use <code>contentAlignment</code> to position them within the box.</p>
