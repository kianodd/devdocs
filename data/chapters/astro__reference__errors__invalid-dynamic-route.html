<p><strong>InvalidDynamicRoute</strong>: The INVALID_PARAM param for route ROUTE is invalid. Received <strong>RECEIVED</strong>.</p>

<h2 id="what-went-wrong">What went wrong?</h2>
<p>A dynamic route param is invalid. This is often caused by an <code>undefined</code> parameter or a missing <a href="#/doc/astro/guides/routing@rest-parameters">rest parameter</a>.</p>
