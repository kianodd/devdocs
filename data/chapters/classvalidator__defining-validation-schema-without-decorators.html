<p>Schema-based validation without decorators is no longer supported by <code>class-validator</code>. This feature was broken in version 0.12 and it will not be fixed. If you are interested in schema-based validation, you can find several such frameworks in <a target="_blank" rel="noopener" href="https://github.com/colinhacks/zod#comparison">the zod readme&#39;s comparison section</a>.</p>
