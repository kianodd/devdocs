<p>&#39;function1&#39; does not implement inherited abstract member &#39;function2&#39;  </p>
<p> A class is required to implement all the <a href="#/doc/csharp/language-reference/keywords/abstract">abstract</a> members in the base class, unless the class is also abstract.  </p>
