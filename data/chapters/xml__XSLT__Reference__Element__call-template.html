<p>The <code>&lt;xsl:call-template&gt;</code> element invokes a named template.</p>
<h2 id="syntax">Syntax</h2>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>HTML</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-plaintext">&lt;xsl:call-template name=NAME&gt;
  &lt;xsl:with-param&gt; [optional]
&lt;/xsl:call-template&gt;</code></pre></div></figure>
<h3 id="required-attribute">Required Attribute</h3>
<ul>
<li><code>name</code><ul>
<li>: Specifies the name of the template you wish to invoke.</li>
</ul>
</li>
</ul>
<h3 id="optional-attributes">Optional Attributes</h3>
<p>None.</p>
<h3 id="type">Type</h3>
<p>Instruction, appears within a template.</p>
<h2 id="specifications">Specifications</h2>
<p>XSLT, section 6.</p>
<h2 id="gecko-support">Gecko support</h2>
<p>Supported.</p>
