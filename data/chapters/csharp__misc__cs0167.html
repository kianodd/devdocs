<p>The delegate &#39;delegate&#39; is missing the Invoke method  </p>
<p> You imported and used a managed program (one that uses the .NET runtime) that was created with another compiler. That compiler allowed an ill-formed <a href="#/doc/csharp/language-reference/builtin-types/reference-types">delegate</a>. Therefore, the <code>Invoke</code> method was not available. For more information, see <a href="#/doc/csharp/programming-guide/delegates/index">Delegates</a>.</p>
