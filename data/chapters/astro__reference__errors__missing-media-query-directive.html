<blockquote>
<p><strong>MissingMediaQueryDirective</strong>: Media query not provided for <code>client:media</code> directive. A media query similar to <code>client:media=&quot;(max-width: 600px)&quot;</code> must be provided.</p>
</blockquote>
<h2 id="what-went-wrong">What went wrong?</h2>
<p>A <a target="_blank" rel="noopener" href="https://developer.mozilla.org/en-US/docs/Web/CSS/Media_Queries/Using_media_queries">media query</a> parameter is required when using the <code>client:media</code> directive.</p>
