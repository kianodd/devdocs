<p>Missing file specification for &#39;option&#39; option  </p>
<p> A <a href="#/doc/csharp/language-reference/compiler-options/index">compiler option</a> was only partially specified.  </p>
<p> For example, when using <code>-recurse</code>, you must specify the file to search: <strong>/recurse:<em><strong>filename</strong></em>.cs</strong>.  </p>
<h2 id="example">Example</h2>
<p> The following sample generates CS2005.  </p>
