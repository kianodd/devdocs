<p>The <strong><code>blank</code></strong> accessor property of <code>Temporal.Duration</code> instances returns a boolean that is <code>true</code> if this duration represents a zero duration, and <code>false</code> otherwise. It is equivalent to <code>duration.sign === 0</code>.</p>
