<h2 id="rc-notes">RC notes</h2>
<p>For React Native Web Image and Expo Image, use explicit <code>resizeMode</code> or <code>contentFit</code> props. A utility on the outer View does not establish the nested image fit. Native image adapters and HTML img elements have separate contracts.</p>
