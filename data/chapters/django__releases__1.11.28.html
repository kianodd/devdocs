<p><em>February 3, 2020</em></p>
<p>Django 1.11.28 fixes a security issue in 1.11.27.</p>
<h2 id="cve-2020-7471-potential-sql-injection-via-stringaggdelimiter">CVE-2020-7471: Potential SQL injection via <code>StringAgg(delimiter)</code></h2>
<p>[~django.contrib.postgres.aggregates.StringAgg] aggregation function was subject to SQL injection, using a suitably crafted <code>delimiter</code>.</p>
