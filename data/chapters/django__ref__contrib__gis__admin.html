<h2 id="gismodeladmin"><code>GISModelAdmin</code></h2>
<p><strong><code>GISModelAdmin</code></strong></p>
<p><strong><code>gis_widget</code></strong></p>
<p>The widget class to be used for [~django.contrib.gis.db.models.GeometryField]. Defaults to [~django.contrib.gis.forms.widgets.OSMWidget].</p>
<p><strong><code>gis_widget_kwargs</code></strong></p>
<p>The keyword arguments that would be passed to the [gis_widget]. Defaults to an empty dictionary.</p>
