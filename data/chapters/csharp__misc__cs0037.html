<p>Cannot convert null to &#39;type&#39; because it is a non-nullable value type  </p>
<p> The compiler cannot assign <code>null</code> to a value type; <code>null</code> can only be assigned to a <a href="#/doc/csharp/language-reference/keywords/reference-types">reference type</a> or to a <a href="#/doc/csharp/language-reference/builtin-types/nullable-value-types">nullable value type</a>. <a href="#/doc/csharp/language-reference/builtin-types/struct">struct</a> is a value type.</p>
