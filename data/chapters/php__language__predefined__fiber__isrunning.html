<p>Fiber::isRunning</p>
<p>Determines if the fiber is running</p>
<p>bool</p>
<p>Fiber::isRunning</p>
<h1></h1>
<h1></h1>
<p>Returns only if the fiber is running. A fiber is considered running after a call to Fiber::start, Fiber::resume, or Fiber::throw that has not yet returned. Returns if the fiber is not running.</p>
