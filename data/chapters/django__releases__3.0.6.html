<p><em>May 4, 2020</em></p>
<p>Django 3.0.6 fixes a bug in 3.0.5.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Fixed a regression in Django 3.0 that caused a crash when filtering a <code>Subquery()</code> annotation of a queryset containing a single related field against a <code>SimpleLazyObject</code> ([31420]).</li>
</ul>
