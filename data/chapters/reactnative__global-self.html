<p><a target="_blank" rel="noopener" href="https://developer.mozilla.org/en-US/docs/Web/API/Window/self"><code>self</code></a> is an alias for <a target="_blank" rel="noopener" href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/globalThis"><code>globalThis</code></a>, as defined in Web specifications.</p>
<p>The use of <code>globalThis</code> is recommended over <code>self</code>.</p>
