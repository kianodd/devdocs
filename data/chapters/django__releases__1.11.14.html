<p><em>July 2, 2018</em></p>
<p>Django 1.11.14 fixes several bugs in 1.11.13.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Fixed <code>WKBWriter.write()</code> and <code>write_hex()</code> for empty polygons on GEOS 3.6.1+ ([29460]).</li>
<li>Fixed a regression in Django 1.10 that could result in large memory usage when making edits using <code>ModelAdmin.list_editable</code> ([28462]).</li>
</ul>
