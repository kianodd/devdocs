<h2 id="usage">Usage</h2>
<p>Here&#39;s a simple example of <code>expo-live-photo</code> usage combined with <code>expo-image-picker</code>.</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Code</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript">
  <span class="hljs-keyword">const</span> viewRef = <span class="hljs-title function_">useRef</span>(<span class="hljs-literal">null</span>);
  <span class="hljs-keyword">const</span> [livePhoto, setLivePhoto] = <span class="hljs-title function_">useState</span>(<span class="hljs-literal">null</span>);

  <span class="hljs-keyword">const</span> <span class="hljs-title function_">pickImage</span> = <span class="hljs-keyword">async</span> (<span class="hljs-params"></span>) =&gt; {
    <span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-title class_">ImagePicker</span>.<span class="hljs-title function_">launchImageLibraryAsync</span>({
      <span class="hljs-attr">mediaTypes</span>: [<span class="hljs-string">&#x27;livePhotos&#x27;</span>],
    });

    <span class="hljs-keyword">if</span> (!result.<span class="hljs-property">canceled</span> &amp;&amp; result.<span class="hljs-property">assets</span>[<span class="hljs-number">0</span>].<span class="hljs-property">pairedVideoAsset</span>?.<span class="hljs-property">uri</span>) {
      <span class="hljs-title function_">setLivePhoto</span>({
        <span class="hljs-attr">photoUri</span>: result.<span class="hljs-property">assets</span>[<span class="hljs-number">0</span>].<span class="hljs-property">uri</span>,
        <span class="hljs-attr">pairedVideoUri</span>: result.<span class="hljs-property">assets</span>[<span class="hljs-number">0</span>].<span class="hljs-property">pairedVideoAsset</span>.<span class="hljs-property">uri</span>,
      });
    } <span class="hljs-keyword">else</span> {
      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&#x27;Failed to pick a live photo&#x27;</span>);
    }
  };

  <span class="hljs-keyword">if</span> (!<span class="hljs-title class_">LivePhotoView</span>.<span class="hljs-title function_">isAvailable</span>()) {
    <span class="hljs-keyword">return</span> (
      
        expo-live-photo is not available on <span class="hljs-variable language_">this</span> platform 😕
      
    );
  }

  <span class="hljs-keyword">return</span> (
    
       {
          <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Live photo loaded successfully!&#x27;</span>);
        }}
        onLoadError={<span class="hljs-function"><span class="hljs-params">error</span> =&gt;</span> {
          <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&#x27;Failed to load the live photo: &#x27;</span>, error.<span class="hljs-property">message</span>);
        }}
      /&gt;
      
        
      
       viewRef.<span class="hljs-property">current</span>?.<span class="hljs-title function_">startPlayback</span>(<span class="hljs-string">&#x27;hint&#x27;</span>)} /&gt;
       viewRef.<span class="hljs-property">current</span>?.<span class="hljs-title function_">startPlayback</span>(<span class="hljs-string">&#x27;full&#x27;</span>)} /&gt;
       viewRef.<span class="hljs-property">current</span>?.<span class="hljs-title function_">stopPlayback</span>()} /&gt;
    
  );
}
