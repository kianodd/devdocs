<p>The <code>mixed</code> type accepts every value. It is equivalent to the <a href="#language.types.type-system.composite.union">union type</a> <code>object|resource|array|string|float|int|bool|null</code>. Available as of PHP 8.0.0.</p>
<p><code>mixed</code> is, in type theory parlance, the top type, meaning every other type is a subtype of it.</p>
