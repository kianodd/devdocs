<p>Could not process image metadata for <code>IMAGE_PATH</code>.</p>
</blockquote>
<h2 id="what-went-wrong">What went wrong?</h2>
<p>Astro could not process the metadata of an image you imported. This is often caused by a corrupted or malformed image and re-exporting the image from your image editor may fix this issue.</p>
