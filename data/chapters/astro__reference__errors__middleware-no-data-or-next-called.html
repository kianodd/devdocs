<blockquote>
<p><strong>MiddlewareNoDataOrNextCalled</strong>: Make sure your middleware returns a <code>Response</code> object, either directly or by returning the <code>Response</code> from calling the <code>next</code> function.</p>
</blockquote>
<h2 id="what-went-wrong">What went wrong?</h2>
<p>Thrown when the middleware does not return any data or call the <code>next</code> function.</p>
<p>For example:</p>
