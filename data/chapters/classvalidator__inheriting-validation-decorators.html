<p>When you define a subclass which extends from another one, the subclass will automatically inherit the parent&#39;s decorators. If a property is redefined in the descendant, class decorators will be applied on it from both its own class and the base class.</p>

  <span class="hljs-meta">@IsEmail</span>()
  <span class="hljs-attr">email</span>: <span class="hljs-built_in">string</span>;

  <span class="hljs-meta">@IsString</span>()
  <span class="hljs-attr">password</span>: <span class="hljs-built_in">string</span>;
}

<span class="hljs-keyword">class</span> <span class="hljs-title class_">User</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">BaseContent</span> {

  <span class="hljs-meta">@Contains</span>(<span class="hljs-string">&#x27;hello&#x27;</span>)

  <span class="hljs-meta">@MinLength</span>(<span class="hljs-number">20</span>)
  <span class="hljs-attr">password</span>: <span class="hljs-built_in">string</span>;
}

<span class="hljs-keyword">let</span> user = <span class="hljs-keyword">new</span> <span class="hljs-title class_">User</span>();

user.<span class="hljs-property">email</span> = <span class="hljs-string">&#x27;invalid email&#x27;</span>; <span class="hljs-comment">// inherited property</span>
user.<span class="hljs-property">password</span> = <span class="hljs-string">&#x27;too short&#x27;</span>; <span class="hljs-comment">// password wil be validated not only against IsString, but against MinLength as well</span>

<span class="hljs-title function_">validate</span>(user).<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">errors</span> =&gt;</span> {
  <span class="hljs-comment">// ...</span>
}); <span class="hljs-comment">// it will return errors for email, password, name and welcome properties</span></code></pre></div></figure>
