<p><em>March 4, 2020</em></p>
<p>Django 1.11.29 fixes a security issue in 1.11.28.</p>
<h2 id="cve-2020-9402-potential-sql-injection-via-tolerance-parameter-in-gis-functions-and-aggregates-on-oracle">CVE-2020-9402: Potential SQL injection via <code>tolerance</code> parameter in GIS functions and aggregates on Oracle</h2>
<p>GIS functions and aggregates on Oracle were subject to SQL injection, using a suitably crafted <code>tolerance</code>.</p>
