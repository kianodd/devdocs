<p>Delegate &#39;del&#39; does not take &#39;number&#39; arguments  </p>
<p> The number of arguments passed to a <a href="#/doc/csharp/language-reference/builtin-types/reference-types">delegate</a> invocation does not agree with the number of parameters in the delegate declaration.  </p>
<p> The following sample generates CS1593:  </p>

using System;  
delegate string func(int i);   // declare delegate  
  
class a  
{  
   public static void Main()  
   {  
      func dt = new func(z);  
      x(dt);  
   }  
  
   public static string z(int j)  
   {  
      Console.WriteLine(j);  
      return j.ToString();  
   }  
  
   public static void x(func hello)
