<p><em>December 3, 2018</em></p>
<p>Django 1.11.17 fixes several bugs in 1.11.16 and adds compatibility with Python 3.7.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Prevented repetitive calls to <code>geos_version_tuple()</code> in the <code>WKBWriter</code> class in an attempt to fix a random crash involving <code>LooseVersion</code> since Django 1.11.14 ([29959]).</li>
</ul>
