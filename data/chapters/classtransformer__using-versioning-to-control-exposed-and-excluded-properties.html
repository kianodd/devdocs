<p>If you are building an API that has different versions, class-transformer has extremely useful tools for that.
You can control which properties of your model should be exposed or excluded in what version. Example:</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>TypeScript</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript">
  <span class="hljs-attr">id</span>: <span class="hljs-built_in">number</span>;

  <span class="hljs-attr">name</span>: <span class="hljs-built_in">string</span>;

  <span class="hljs-meta">@Expose</span>({ <span class="hljs-attr">since</span>: <span class="hljs-number">0.7</span>, <span class="hljs-attr">until</span>: <span class="hljs-number">1</span> }) <span class="hljs-comment">// this means that this property will be exposed for version starting from 0.7 until 1</span>
  <span class="hljs-attr">email</span>: <span class="hljs-built_in">string</span>;

  <span class="hljs-meta">@Expose</span>({ <span class="hljs-attr">since</span>: <span class="hljs-number">2.1</span> }) <span class="hljs-comment">// this means that this property will be exposed for version starting from 2.1</span>
  <span class="hljs-attr">password</span>: <span class="hljs-built_in">string</span>;
}

<span class="hljs-keyword">let</span> user1 = <span class="hljs-title function_">instanceToPlain</span>(user, { <span class="hljs-attr">version</span>: <span class="hljs-number">0.5</span> }); <span class="hljs-comment">// will contain id and name</span>
<span class="hljs-keyword">let</span> user2 = <span class="hljs-title function_">instanceToPlain</span>(user, { <span class="hljs-attr">version</span>: <span class="hljs-number">0.7</span> }); <span class="hljs-comment">// will contain id, name and email</span>
<span class="hljs-keyword">let</span> user3 = <span class="hljs-title function_">instanceToPlain</span>(user, { <span class="hljs-attr">version</span>: <span class="hljs-number">1</span> }); <span class="hljs-comment">// will contain id and name</span>
<span class="hljs-keyword">let</span> user4 = <span class="hljs-title function_">instanceToPlain</span>(user, { <span class="hljs-attr">version</span>: <span class="hljs-number">2</span> }); <span class="hljs-comment">// will contain id and name</span>
<span class="hljs-keyword">let</span> user5 = <span class="hljs-title function_">instanceToPlain</span>(user, { <span class="hljs-attr">version</span>: <span class="hljs-number">2.1</span> }); <span class="hljs-comment">// will contain id, name and password</span></code></pre></div></figure>
