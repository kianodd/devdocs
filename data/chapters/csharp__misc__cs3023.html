<p>CLSCompliant attribute has no meaning when applied to return types.  Try putting it on the method instead.  </p>
<p> Function return types are not checked for CLS Compliance, since the CLS Compliance rules apply to methods and type declarations.  </p>
<h2 id="example">Example</h2>
<p> The following example generates warning CS3023:  </p>
