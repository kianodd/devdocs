<p><em>November 2, 2020</em></p>
<p>Django 3.0.11 fixes a regression in 3.0.7 and adds compatibility with Python 3.9.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Fixed a regression in Django 3.0.7 that didn&#39;t use <code>Subquery()</code> aliases in the <code>GROUP BY</code> clause ([32152]).</li>
</ul>
