<p><strong>ResponseSentError</strong>: The response has already been sent to the browser and cannot be altered.</p>

<h2 id="what-went-wrong">What went wrong?</h2>
<p>Making changes to the response, such as setting headers, cookies, and the status code can only be done in <a href="#/doc/astro/basics/astro-pages">page components</a>.</p>
