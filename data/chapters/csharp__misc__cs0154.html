<p>The property or indexer &#39;property&#39; cannot be used in this context because it lacks the get accessor  </p>
<p> An attempt to use a <a href="#/doc/csharp/programming-guide/classes-and-structs/using-properties">property</a> failed because no get accessor method was defined in the property. For more information, see <a href="#/doc/csharp/programming-guide/classes-and-structs/fields">Fields</a>.  </p>
