<p><code>COLLECTION_NAME</code> → <code>ENTRY_ID</code> has an invalid slug. <code>slug</code> must be a string.</p>

<h2 id="what-went-wrong">What went wrong?</h2>
<p>A collection entry has an invalid <code>slug</code>. This field is reserved for generating entry slugs, and must be a string when present.</p>
