<p>The event &#39;event&#39; can only appear on the left hand side of += or -= (except when used from within the type &#39;type&#39;)  </p>
<p> Outside of the class it is defined in, an <a href="#/doc/csharp/language-reference/keywords/event">event</a> can only add or subtract references. For more information, see <a href="#/doc/csharp/programming-guide/events/index">Events</a>.  </p>
