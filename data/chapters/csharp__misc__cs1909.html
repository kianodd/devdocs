<p>The DefaultParameterValue attribute is not applicable on parameters of type &#39;type&#39;</p>
<p> CS1909 is generated when you use a <code>DefaultParameterValueAttribute</code> attribute that is not applicable on the parameter type. This error message is no longer emitted, see <a href="#/doc/csharp/misc/cs1910">CS1910</a> for more information.</p>
