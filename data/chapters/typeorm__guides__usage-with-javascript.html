<p>TypeORM can be used not only with TypeScript, but also with JavaScript.
Everything is the same, except you need to omit types and if your platform does not support ES6 classes then you need to define objects with all required metadata.</p>

    <span class="hljs-attr">database</span>: <span class="hljs-string">&quot;test&quot;</span>,
    <span class="hljs-attr">synchronize</span>: <span class="hljs-literal">true</span>,
    <span class="hljs-attr">entities</span>: [<span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;./entities/Post&quot;</span>), <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;./entities/Category&quot;</span>)],
})

dataSource
    .<span class="hljs-title function_">initialize</span>()
    .<span class="hljs-title function_">then</span>(<span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) {
        <span class="hljs-keyword">var</span> category1 = {
            <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;TypeScript&quot;</span>,
        }
        <span class="hljs-keyword">var</span> category2 = {
            <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Programming&quot;</span>,
        }

        <span class="hljs-keyword">var</span> post = {
            <span class="hljs-attr">title</span>: <span class="hljs-string">&quot;Control flow based type analysis&quot;</span>,
            <span class="hljs-attr">text</span>: <span class="hljs-string">&quot;TypeScript 2.0 implements a control flow-based type analysis for local variables and parameters.&quot;</span>,
            <span class="hljs-attr">categories</span>: [category1, category2],
        }

        <span class="hljs-keyword">var</span> postRepository = dataSource.<span class="hljs-title function_">getRepository</span>(<span class="hljs-string">&quot;Post&quot;</span>)

            .<span class="hljs-title function_">save</span>(post)
            .<span class="hljs-title function_">then</span>(<span class="hljs-keyword">function</span> (<span class="hljs-params">savedPost</span>) {
                <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Post has been saved: &quot;</span>, savedPost)
                <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Now lets load all posts: &quot;</span>)

                <span class="hljs-keyword">return</span> postRepository.<span class="hljs-title function_">find</span>()
            })
            .<span class="hljs-title function_">then</span>(<span class="hljs-keyword">function</span> (<span class="hljs-params">allPosts</span>) {
                <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;All posts: &quot;</span>, allPosts)
            })
    })
    .<span class="hljs-title function_">catch</span>(<span class="hljs-keyword">function</span> (<span class="hljs-params">error</span>) {
