<p>Expo UI NavigationBar matches the official Jetpack Compose <a target="_blank" rel="noopener" href="https://developer.android.com/develop/ui/compose/components/navigation-bar"><code>NavigationBar</code></a> API. It displays a row of destinations for switching between top-level app sections.</p>

<h2 id="usage">Usage</h2>
