<p>Nativewind provides the <code>remapProps</code> utility to simplify working with third-party components with multiple &quot;style&quot; props.</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Code</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript">

<span class="hljs-comment">/**
  ThirdPartyButton is a component with two &quot;style&quot; props, buttonStyle &amp; labelStyle.
  We can use remapProps to create new props that accept Tailwind CSS&#x27;s classNames.
 */</span>
<span class="hljs-keyword">const</span> <span class="hljs-title class_">CustomizedButton</span> = <span class="hljs-title function_">remapProps</span>(<span class="hljs-title class_">ThirdPartyButton</span>, {
  <span class="hljs-attr">buttonClass</span>: <span class="hljs-string">&quot;buttonStyle&quot;</span>,
  <span class="hljs-attr">labelClass</span>: <span class="hljs-string">&quot;labelStyle&quot;</span>,
});

;</code></pre></div></figure>
<p><code>remapProps</code> can be used with the following options</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Code</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript"><span class="hljs-comment">// Create a new prop and map it to an existing prop</span>
<span class="hljs-title function_">remapProps</span>(component, { <span class="hljs-string">&quot;new-prop&quot;</span>: <span class="hljs-string">&quot;existing-prop&quot;</span> });

<span class="hljs-comment">// Override an existing prop.</span>
<span class="hljs-title function_">remapProps</span>(component, { <span class="hljs-attr">prop</span>: <span class="hljs-literal">true</span> });</code></pre></div></figure>
