<p>Can only use array initializer expressions to assign to array types. Try using a new expression instead.  </p>
<p> Syntax that is appropriate to initialize an array was used in the declaration of a non-array.  </p>
<h2 id="example">Example</h2>
<p> The following sample generates CS0622:  </p>
