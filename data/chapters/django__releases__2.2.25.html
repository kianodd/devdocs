<p><em>December 7, 2021</em></p>
<p>Django 2.2.25 fixes a security issue with severity &quot;low&quot; in 2.2.24.</p>
<h2 id="cve-2021-44420-potential-bypass-of-an-upstream-access-control-based-on-url-paths">CVE-2021-44420: Potential bypass of an upstream access control based on URL paths</h2>
<p>HTTP requests for URLs with trailing newlines could bypass an upstream access control based on URL paths.</p>
