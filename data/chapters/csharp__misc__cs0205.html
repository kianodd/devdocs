<p>Cannot call an abstract base member: &#39;method&#39;  </p>
<p> You cannot call an <a href="#/doc/csharp/language-reference/keywords/abstract">abstract</a> method because it does not have a method body. For more information, see <a href="#/doc/csharp/programming-guide/classes-and-structs/abstract-and-sealed-classes-and-class-members">Abstract and Sealed Classes and Class Members</a>.  </p>
