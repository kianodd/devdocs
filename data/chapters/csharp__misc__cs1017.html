<p>Catch clauses cannot follow the general catch clause of a try statement  </p>
<p> A <code>catch</code> block that does not take any parameters must be the last in a series of <code>catch</code> blocks. For more information on exceptions, see <a href="#/doc/csharp/fundamentals/exceptions/index">Exceptions and Exception Handling</a>.  </p>
