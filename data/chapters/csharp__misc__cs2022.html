<p>Options &#39;/out&#39; and &#39;/target&#39; must appear before source file names  </p>
<p> The <a href="#/doc/csharp/language-reference/compiler-options/output@outputassembly"><strong>-out</strong> (Set Output Filename)</a> and <a href="#/doc/csharp/language-reference/compiler-options/output@outputtype">-target (Specify Output File Format)</a> compiler options, when specified on the command line, must precede the source code files.</p>
