<p>To use validation use <a target="_blank" rel="noopener" href="https://github.com/pleerock/class-validator">class-validator</a>.
Example how to use class-validator with TypeORM:</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>TypeScript</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript">

    <span class="hljs-title class_">Contains</span>,
    <span class="hljs-title class_">IsInt</span>,
    <span class="hljs-title class_">Length</span>,
    <span class="hljs-title class_">IsEmail</span>,
    <span class="hljs-title class_">IsFQDN</span>,
    <span class="hljs-title class_">IsDate</span>,
    <span class="hljs-title class_">Min</span>,
    <span class="hljs-title class_">Max</span>,
} <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;class-validator&quot;</span>

<span class="hljs-meta">@Entity</span>()

    <span class="hljs-meta">@PrimaryGeneratedColumn</span>()
    <span class="hljs-attr">id</span>: <span class="hljs-built_in">number</span>

    <span class="hljs-meta">@Column</span>()
    <span class="hljs-meta">@Length</span>(<span class="hljs-number">10</span>, <span class="hljs-number">20</span>)
    <span class="hljs-attr">title</span>: <span class="hljs-built_in">string</span>

    <span class="hljs-meta">@Column</span>()
    <span class="hljs-meta">@Contains</span>(<span class="hljs-string">&quot;hello&quot;</span>)
    <span class="hljs-attr">text</span>: <span class="hljs-built_in">string</span>

    <span class="hljs-meta">@Column</span>()
    <span class="hljs-meta">@IsInt</span>()
    <span class="hljs-meta">@Min</span>(<span class="hljs-number">0</span>)
    <span class="hljs-meta">@Max</span>(<span class="hljs-number">10</span>)
    <span class="hljs-attr">rating</span>: <span class="hljs-built_in">number</span>

    <span class="hljs-meta">@Column</span>()
    <span class="hljs-meta">@IsEmail</span>()
    <span class="hljs-attr">email</span>: <span class="hljs-built_in">string</span>

    <span class="hljs-meta">@Column</span>()
    <span class="hljs-meta">@IsFQDN</span>()
    <span class="hljs-attr">site</span>: <span class="hljs-built_in">string</span>

    <span class="hljs-meta">@Column</span>()
    <span class="hljs-meta">@IsDate</span>()
    <span class="hljs-attr">createDate</span>: <span class="hljs-title class_">Date</span>
}</code></pre></div></figure>
<p>Validation:</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>TypeScript</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript">

<span class="hljs-keyword">let</span> post = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Post</span>()
post.<span class="hljs-property">title</span> = <span class="hljs-string">&quot;Hello&quot;</span> <span class="hljs-comment">// should not pass</span>
post.<span class="hljs-property">text</span> = <span class="hljs-string">&quot;this is a great post about hell world&quot;</span> <span class="hljs-comment">// should not pass</span>
post.<span class="hljs-property">rating</span> = <span class="hljs-number">11</span> <span class="hljs-comment">// should not pass</span>
post.<span class="hljs-property">email</span> = <span class="hljs-string">&quot;google.com&quot;</span> <span class="hljs-comment">// should not pass</span>
post.<span class="hljs-property">site</span> = <span class="hljs-string">&quot;googlecom&quot;</span> <span class="hljs-comment">// should not pass</span>

<span class="hljs-keyword">const</span> errors = <span class="hljs-keyword">await</span> <span class="hljs-title function_">validate</span>(post)
<span class="hljs-keyword">if</span> (errors.<span class="hljs-property">length</span> &gt; <span class="hljs-number">0</span>) {
    <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Error</span>(<span class="hljs-string">`Validation failed!`</span>)
} <span class="hljs-keyword">else</span> {
    <span class="hljs-keyword">await</span> dataSource.<span class="hljs-property">manager</span>.<span class="hljs-title function_">save</span>(post)
}</code></pre></div></figure>
