<p>Validator supports service container in the case if want to inject dependencies into your custom validator constraint
classes. Here is example how to integrate it with [typedi][2]:</p>

<span class="hljs-comment">// do this somewhere in the global application level:</span>
<span class="hljs-title function_">useContainer</span>(<span class="hljs-title class_">Container</span>);
<span class="hljs-keyword">let</span> validator = <span class="hljs-title class_">Container</span>.<span class="hljs-title function_">get</span>(<span class="hljs-title class_">Validator</span>);

<span class="hljs-comment">// now everywhere you can inject Validator class which will go from the container</span>
