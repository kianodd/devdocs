<p><em>August 3, 2020</em></p>
<p>Django 3.0.9 fixes several bugs in 3.0.8.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Allowed setting the <code>SameSite</code> cookie flag in [.HttpResponse.delete_cookie] ([31790]).</li>
<li>Fixed crash when sending emails to addresses with display names longer than 75 chars on Python 3.6.11+, 3.7.8+, and 3.8.4+ ([31784]).</li>
</ul>
