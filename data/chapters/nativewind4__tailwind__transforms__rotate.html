<h2 id="compatibility">Compatibility</h2>
<p>Always include the <code>deg</code> unit when using arbitrary styles or setting <code>rotate</code> values in your theme. e.g. <code>rotate-[90deg]</code>.</p>
<p>React Native only supports <code>deg</code> as a unit for rotation.</p>
