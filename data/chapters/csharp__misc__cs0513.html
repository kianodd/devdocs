<p>&#39;function&#39; is abstract but it is contained in nonabstract class &#39;class&#39;  </p>
<p> A method cannot be an <a href="#/doc/csharp/language-reference/keywords/abstract">abstract</a> member of a nonabstract class.  </p>
<p> The following sample generates CS0513:  </p>
