<p>&#39;member&#39; : new protected member declared in sealed class  </p>
<p> A <a href="#/doc/csharp/language-reference/keywords/sealed">sealed</a> class cannot introduce a <a href="#/doc/csharp/language-reference/keywords/protected">protected</a> member because no other class will be able to inherit from the <code>sealed</code> class and use the <code>protected</code> member.  </p>
<p> The following sample generates CS0628:  </p>
