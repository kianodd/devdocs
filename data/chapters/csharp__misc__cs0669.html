<p>A class with the ComImport attribute cannot have a user-defined constructor.</p>
<p>The COM interop layer in the common language runtime supplies the constructor for ComImport classes. Consequently, a COM object can be used as a managed object in the runtime.</p>
<p>The following sample generates CS0669:</p>
