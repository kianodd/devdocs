<p>Next.js exposes some options that give you some control over how the server will dispose or keep in memory built pages in development.</p>
<p>To change the defaults, open <code>next.config.js</code> and add the <code>onDemandEntries</code> config:</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>next.config.js</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-javascript"><span class="hljs-variable language_">module</span>.<span class="hljs-property">exports</span> = {
  <span class="hljs-attr">onDemandEntries</span>: {
    <span class="hljs-comment">// period (in ms) where the server will keep pages in the buffer</span>
    <span class="hljs-attr">maxInactiveAge</span>: <span class="hljs-number">25</span> * <span class="hljs-number">1000</span>,
    <span class="hljs-comment">// number of pages that should be kept simultaneously without being disposed</span>
    <span class="hljs-attr">pagesBufferLength</span>: <span class="hljs-number">2</span>,
  },
}</code></pre></div></figure>
