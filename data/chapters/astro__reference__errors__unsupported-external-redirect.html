<blockquote>
<p><strong>UnsupportedExternalRedirect</strong>: The destination URL in the external redirect from &quot;FROM&quot; to &quot;TO&quot; is unsupported.</p>
</blockquote>
<h2 id="what-went-wrong">What went wrong?</h2>
<p>An external redirect must start with http or https, and must be a valid URL.</p>
