<p>The enumerator name &#39;value__&#39; is reserved and cannot be used</p>
<p> An item in an <a href="#/doc/csharp/language-reference/builtin-types/enum">enumeration</a> cannot have an identifier called <strong>value__</strong> since it&#39;s reserved for use as the enumeration&#39;s backing field.</p>
