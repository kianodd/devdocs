<p>Compiler option &#39;compiler_option&#39; must be followed by an argument  </p>
<p> Some compiler options require parameters. If you do not pass the arguments required by the compiler option, CS0005 is generated.  </p>
<p> For more information, see <a href="#/doc/csharp/language-reference/compiler-options/index">C# Compiler Options</a>.</p>
