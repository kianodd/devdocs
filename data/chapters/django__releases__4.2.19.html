<p><em>February 5, 2025</em></p>
<p>Django 4.2.19 fixes a regression in 4.2.18.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Fixed a regression in Django 4.2.18 that caused <code>validate_ipv6_address()</code> and <code>validate_ipv46_address()</code> to crash when handling non-string values ([36098]).</li>
</ul>
