<p>Follow the standard <a target="_blank" rel="noopener" href="https://www.msys2.org/">installation instructions</a>. Then, to grab the requisite Fortran compiler with <code>MVSC</code>:</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Terminal</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-bash">
<span class="tk-com"># Assuming a fresh install</span>
<span class="tk-cmd">pacman</span> <span class="tk-flag">-Syu</span> # Restart the terminal
<span class="tk-cmd">pacman</span> <span class="tk-flag">-Su</span>  # Update packages
<span class="tk-com"># Get the toolchains</span>
<span class="tk-cmd">pacman</span> <span class="tk-flag">-S</span> <span class="tk-flag">--needed</span> base-devel gcc-fortran
<span class="tk-cmd">pacman</span> <span class="tk-flag">-S</span> mingw-w64-x86_64-toolchain</code></pre></div></figure>
