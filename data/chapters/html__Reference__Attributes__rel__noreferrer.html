<p>The <strong><code>noreferrer</code></strong> keyword for the <a href="#/doc/html/Reference/Attributes/rel"><code>rel</code></a> attribute of the <code>a</code>, <code>area</code>, and <code>form</code> elements instructs the browser, when fetching the target resource, to omit the Referer header and otherwise leak no referrer information — and additionally to behave as if the <a href="#/doc/html/Reference/Attributes/rel/noopener"><code>noopener</code></a> keyword were also specified.</p>
