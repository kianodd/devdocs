<p>Expected contextual keyword &#39;equals&#39;  </p>
<p> The pattern for a <code>join</code> clause is <code>join</code>...<code>in</code>...<code>on</code>...<code>equals</code>, as shown in this example:  </p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Code</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-plaintext">var query = from x in array1  
            join y in array2 on x equals y  
            select x;  </code></pre></div></figure>
<h2 id="to-correct-this-error">To correct this error</h2>
<ol>
<li>Add the <code>equals</code> keyword to the <code>join</code> clause.</li>
</ol>
