<p><em>September 2, 2014</em></p>
<p>Django 1.6.7 fixes several bugs in 1.6.6, including a regression related to a security fix in that release.</p>
<h2 id="bugfixes">Bugfixes</h2>
<ul>
<li>Allowed inherited and m2m fields to be referenced in the admin ([23329]).</li>
<li>Fixed a crash when using <code>QuerySet.defer()</code> with <code>select_related()</code> ([23370]).</li>
</ul>
