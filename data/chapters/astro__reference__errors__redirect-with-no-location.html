<blockquote>
<p><strong>RedirectWithNoLocation</strong>: The redirect <code>Response</code> has no <code>Location</code> header. Use <code>Astro.redirect()</code> to create redirects, or add a <code>Location</code> header to the <code>Response</code>.</p>
</blockquote>
<h2 id="what-went-wrong">What went wrong?</h2>
<p>A redirect must be given a location with the <code>Location</code> header.</p>
