<p>The &#39;l&#39; suffix is easily confused with the digit &#39;1&#39; -- use &#39;L&#39; for clarity</p>
<p>The compiler warns when it detects a long literal using a lowercase l instead of an uppercase L.</p>
<p>The following sample generates CS0078:</p>
