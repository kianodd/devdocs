<p><code>Accelerometer</code> from <code>expo-sensors</code> provides access to the device accelerometer sensor(s) and associated listeners to respond to changes in acceleration in three-dimensional space, meaning any movement or vibration.</p>

  <span class="hljs-keyword">const</span> [{ x, y, z }, setData] = <span class="hljs-title function_">useState</span>({
    <span class="hljs-attr">x</span>: <span class="hljs-number">0</span>,
    <span class="hljs-attr">y</span>: <span class="hljs-number">0</span>,
    <span class="hljs-attr">z</span>: <span class="hljs-number">0</span>,
  });
  <span class="hljs-keyword">const</span> [subscription, setSubscription] = <span class="hljs-title function_">useState</span>(<span class="hljs-literal">null</span>);

  <span class="hljs-keyword">const</span> <span class="hljs-title function_">_slow</span> = (<span class="hljs-params"></span>) =&gt; <span class="hljs-title class_">Accelerometer</span>.<span class="hljs-title function_">setUpdateInterval</span>(<span class="hljs-number">1000</span>);
  <span class="hljs-keyword">const</span> <span class="hljs-title function_">_fast</span> = (<span class="hljs-params"></span>) =&gt; <span class="hljs-title class_">Accelerometer</span>.<span class="hljs-title function_">setUpdateInterval</span>(<span class="hljs-number">16</span>);

  <span class="hljs-keyword">const</span> <span class="hljs-title function_">_subscribe</span> = (<span class="hljs-params"></span>) =&gt; {
    <span class="hljs-title function_">setSubscription</span>(<span class="hljs-title class_">Accelerometer</span>.<span class="hljs-title function_">addListener</span>(setData));
  };

  <span class="hljs-keyword">const</span> <span class="hljs-title function_">_unsubscribe</span> = (<span class="hljs-params"></span>) =&gt; {
    subscription &amp;&amp; subscription.<span class="hljs-title function_">remove</span>();
    <span class="hljs-title function_">setSubscription</span>(<span class="hljs-literal">null</span>);
  };

  <span class="hljs-title function_">useEffect</span>(<span class="hljs-function">() =&gt;</span> {
    <span class="hljs-title function_">_subscribe</span>();
    <span class="hljs-keyword">return</span> <span class="hljs-function">() =&gt;</span> <span class="hljs-title function_">_unsubscribe</span>();
  }, []);

  <span class="hljs-keyword">return</span> (
    
      <span class="hljs-title class_">Accelerometer</span>: (<span class="hljs-keyword">in</span> gs where 1g = <span class="hljs-number">9.81</span> m/s^<span class="hljs-number">2</span>)
      <span class="hljs-attr">x</span>: {x}
      <span class="hljs-attr">y</span>: {y}
      <span class="hljs-attr">z</span>: {z}
      
        
          {subscription ? <span class="hljs-string">&#x27;On&#x27;</span> : <span class="hljs-string">&#x27;Off&#x27;</span>}
        
        
          <span class="hljs-title class_">Slow</span>
        
        
          <span class="hljs-title class_">Fast</span>
        
      
    
  );
}
