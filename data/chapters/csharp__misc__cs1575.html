<p>A stackalloc expression requires [] after type  </p>
<p> The size of the requested allocation, with <a href="#/doc/csharp/language-reference/operators/stackalloc">stackalloc</a>, must be specified in square brackets.  </p>
<p> The following sample generates CS1575:  </p>

// compile with: /unsafe
