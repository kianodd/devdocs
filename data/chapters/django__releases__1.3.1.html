<p><em>September 9, 2011</em></p>
<p>Welcome to Django 1.3.1!</p>
<p>This is the first security release in the Django 1.3 series, fixing several security issues in Django 1.3. Django 1.3.1 is a recommended upgrade for all users of Django 1.3.</p>
<p>For a full list of issues addressed in this release, see the <a target="_blank" rel="noopener" href="https://www.djangoproject.com/weblog/2011/sep/09/security-releases-issued/">security advisory</a>.</p>
