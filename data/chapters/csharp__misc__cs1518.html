<p>Expected class, delegate, enum, interface, or struct  </p>
<p> A declaration was found that is not supported in a <a href="#/doc/csharp/language-reference/keywords/namespace">namespace</a>. Inside a namespace, the compiler accepts only classes, structs, enums, interfaces, namespaces, and delegates.  </p>
