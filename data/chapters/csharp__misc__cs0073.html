<p>An add or remove accessor must have a body  </p>
<p> An <strong>add</strong> or <strong>remove</strong> keyword in an <a href="#/doc/csharp/language-reference/keywords/event">event</a> definition must have a body. For more information, see <a href="#/doc/csharp/programming-guide/events/index">Events</a>.  </p>
