<h2 id="what-went-wrong">What went wrong?</h2>
<p>Astro components cannot be rendered manually via a function call, such as <code>Component()</code> or <code>{items.map(Component)}</code>. Prefer the component syntax `` or <code>{items.map(item =&gt; )}</code>.</p>
