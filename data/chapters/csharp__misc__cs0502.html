<p>&#39;member&#39; cannot be both abstract and sealed  </p>
<p> A class member cannot be both <a href="#/doc/csharp/language-reference/keywords/abstract">abstract</a> and <a href="#/doc/csharp/language-reference/keywords/sealed">sealed</a>.  </p>
