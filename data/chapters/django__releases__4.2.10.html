<p><em>February 6, 2024</em></p>
<p>Django 4.2.10 fixes a security issue with severity &quot;moderate&quot; in 4.2.9.</p>
<h2 id="cve-2024-24680-potential-denial-of-service-in-intcomma-template-filter">CVE-2024-24680: Potential denial-of-service in <code>intcomma</code> template filter</h2>
<p>The <code>intcomma</code> template filter was subject to a potential denial-of-service attack when used with very long strings.</p>
