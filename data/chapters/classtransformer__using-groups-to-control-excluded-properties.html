<p>You can use groups to control what data will be exposed and what will not be:</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>TypeScript</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript">
  <span class="hljs-attr">id</span>: <span class="hljs-built_in">number</span>;

  <span class="hljs-attr">name</span>: <span class="hljs-built_in">string</span>;

  <span class="hljs-meta">@Expose</span>({ <span class="hljs-attr">groups</span>: [<span class="hljs-string">&#x27;user&#x27;</span>, <span class="hljs-string">&#x27;admin&#x27;</span>] }) <span class="hljs-comment">// this means that this data will be exposed only to users and admins</span>
  <span class="hljs-attr">email</span>: <span class="hljs-built_in">string</span>;

  <span class="hljs-meta">@Expose</span>({ <span class="hljs-attr">groups</span>: [<span class="hljs-string">&#x27;user&#x27;</span>] }) <span class="hljs-comment">// this means that this data will be exposed only to users</span>
  <span class="hljs-attr">password</span>: <span class="hljs-built_in">string</span>;
}

<span class="hljs-keyword">let</span> user1 = <span class="hljs-title function_">instanceToPlain</span>(user, { <span class="hljs-attr">groups</span>: [<span class="hljs-string">&#x27;user&#x27;</span>] }); <span class="hljs-comment">// will contain id, name, email and password</span>
<span class="hljs-keyword">let</span> user2 = <span class="hljs-title function_">instanceToPlain</span>(user, { <span class="hljs-attr">groups</span>: [<span class="hljs-string">&#x27;admin&#x27;</span>] }); <span class="hljs-comment">// will contain id, name and email</span></code></pre></div></figure>
