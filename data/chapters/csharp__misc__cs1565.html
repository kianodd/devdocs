<p>Conflicting options specified: Win32 resource file; Win32 icon  </p>
<p> It is not valid to specify both the <a href="#/doc/csharp/language-reference/compiler-options/resources@win32resource"><strong>Win32Resource</strong></a> compiler option and the <a href="#/doc/csharp/language-reference/compiler-options/resources@win32icon"><strong>Win32Icon</strong></a> compiler option in the same compilation.</p>
