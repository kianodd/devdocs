<p><em>November 6, 2013</em></p>
<p>Django 1.4.10 fixes a Python-compatibility bug in the 1.4 series.</p>
<h2 id="python-compatibility">Python compatibility</h2>
<p>Django 1.4.9 inadvertently introduced issues with Python 2.5 compatibility. Django 1.4.10 restores Python 2.5 compatibility. This was issue #21362 in Django&#39;s Trac.</p>
