<h2 id="polyfilled-units">Polyfilled Units</h2>
<p>You can use these units within classes or <code>tailwind.config.js</code>.</p>
<div class="table-wrap"><table>
  <tbody>
    <tr>
      <th>Unit</th>
      <th>Name</th>
      <th>Description</th>
    </tr>
    <tr>
      <td>vw</td>
      <td>View Width</td>
      <td>Polyfilled using Dimensions.get('window')</td>
    </tr>
    <tr>
      <td>vh</td>
      <td>View height</td>
      <td>Polyfilled using Dimensions.get('window')</td>
    </tr>
  </tbody>
</table></div>
