<p><code>require</code> is identical to <code>include</code> except upon failure it will also produce an <code>Error</code> exception (<code>E_COMPILE_ERROR</code> level error prior to PHP 8.0.0) whereas <code>include</code> will only produce a warning (<code>E_WARNING</code> level error).</p>
<p>See the <code>include</code> documentation for how this works.</p>
