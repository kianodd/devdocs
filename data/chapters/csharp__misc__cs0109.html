<p>The member &#39;member&#39; does not hide an inherited member. The new keyword is not required  </p>
<p> A class declaration included the <a href="#/doc/csharp/language-reference/keywords/new-modifier">new</a> keyword even though the declaration does not override an existing declaration in a base class. You can delete the <strong>new</strong> keyword.  </p>
