<p>Assignment in conditional expression is always constant; did you mean to use == instead of = ?  </p>
<p> A conditional expression used the <a href="#/doc/csharp/language-reference/operators/assignment-operator">= operator</a> and not the <a href="#/doc/csharp/language-reference/operators/equality-operators@equality-operator-">== operator</a>.</p>
<p> The following sample generates CS0665:  </p>
