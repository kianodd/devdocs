<p>&#39;class&#39;: a class cannot be both static and sealed  </p>
<p> This error occurs when you declare a class that is both static and sealed. Static classes are inherently sealed, so the sealed modifier is not necessary. To resolve, use one modifier only.  </p>
<p> The following example generates CS0441:  </p>
