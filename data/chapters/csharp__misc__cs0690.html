<p>Input file &#39;file&#39; contains invalid metadata.  </p>
<p> You are able to open the metadata file, but due to some localization problem, the metadata was corrupted. This is similar to error <a href="#/doc/csharp/misc/cs0009">CS0009</a>, except that you are able to open the metadata file.  </p>
<p> A PE (Process Executable) is an executable file.</p>
