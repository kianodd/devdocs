<p>Use the <code>with</code> keyword in the following contexts:</p>
<ul>
<li>In a <a href="#/doc/csharp/language-reference/operators/with-expression"><code>with</code> expression</a> to create a copy and apply modifications to one or more properties.</li>
<li>In a <a href="#/doc/csharp/language-reference/operators/collection-expressions">collection expression</a> to specify parameters to the constructor for the initialized collection.</li>
</ul>
