<p>It&#39;s possible to pass a custom object to decorators which will be accessible on the <code>ValidationError</code> instance of the property if validation failed.</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>TypeScript</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript">

<span class="hljs-keyword">class</span> <span class="hljs-title class_">MyClass</span> {
  <span class="hljs-meta">@MinLength</span>(<span class="hljs-number">32</span>, {
    <span class="hljs-attr">message</span>: <span class="hljs-string">&#x27;EIC code must be at least 32 characters&#x27;</span>,
    <span class="hljs-attr">context</span>: {
      <span class="hljs-attr">errorCode</span>: <span class="hljs-number">1003</span>,
      <span class="hljs-attr">developerNote</span>: <span class="hljs-string">&#x27;The validated string must contain 32 or more characters.&#x27;</span>,
    },
  })
  <span class="hljs-attr">eicCode</span>: <span class="hljs-built_in">string</span>;
}

<span class="hljs-keyword">const</span> model = <span class="hljs-keyword">new</span> <span class="hljs-title class_">MyClass</span>();

<span class="hljs-title function_">validate</span>(model).<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">errors</span> =&gt;</span> {
  <span class="hljs-comment">//errors[0].contexts[&#x27;minLength&#x27;].errorCode === 1003</span>
});</code></pre></div></figure>
