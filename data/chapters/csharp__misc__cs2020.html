<p>Only the first set of input files can build a target other than &#39;module&#39;  </p>
<p> In a multi-output compilation, the first output file must be built with <a href="#/doc/csharp/language-reference/compiler-options/output">-target:exe</a>, <a href="#/doc/csharp/language-reference/compiler-options/output">-target:winexe</a>, or <a href="#/doc/csharp/language-reference/compiler-options/output">-target:library</a>. Any subsequent output files must be built with <a href="#/doc/csharp/language-reference/compiler-options/output">-target:module</a>.</p>
