<p>An event in an interface cannot have add or remove accessors  </p>
<p> You cannot define an event&#39;s accessor functions in an <a href="#/doc/csharp/language-reference/keywords/interface">interface</a>. For more information, see <a href="#/doc/csharp/programming-guide/events/index">Events</a> and <a href="#/doc/csharp/fundamentals/types/interfaces">Interfaces</a>.  </p>
