<p>Lets say you want to download users and want them automatically to be mapped to the instances of <code>User</code> class.</p>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>TypeScript</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript">

<span class="hljs-variable language_">this</span>.<span class="hljs-property">http</span>
  .<span class="hljs-title function_">get</span>(<span class="hljs-string">&#x27;users.json&#x27;</span>)
  .<span class="hljs-title function_">map</span>(<span class="hljs-function"><span class="hljs-params">res</span> =&gt;</span> res.<span class="hljs-title function_">json</span>())
  .<span class="hljs-title function_">map</span>(<span class="hljs-function"><span class="hljs-params">res</span> =&gt;</span> <span class="hljs-title function_">plainToInstance</span>(<span class="hljs-title class_">User</span>, res <span class="hljs-keyword">as</span> <span class="hljs-title class_">Object</span>[]))
  .<span class="hljs-title function_">subscribe</span>(<span class="hljs-function"><span class="hljs-params">users</span> =&gt;</span> {
    <span class="hljs-comment">// now &quot;users&quot; is type of User[] and each user has getName() and isAdult() methods available</span>
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(users);
  });</code></pre></div></figure>
<p>You can also inject a class <code>ClassTransformer</code> as a service in <code>providers</code>, and use its methods.</p>

Source code is <a target="_blank" rel="noopener" href="https://github.com/pleerock/class-transformer-demo">here</a>.</p>
