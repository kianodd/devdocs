<p>Allows you to generate <a target="_blank" rel="noopener" href="https://effect.website/">effect</a> schemas from Drizzle ORM schemas.</p>
<p><strong>Features</strong></p>
<ul>
<li>Create a select schema for tables, views and enums.</li>
<li>Create insert and update schemas for tables.</li>
</ul>
<h4 id="usage">Usage</h4>
<figure class="code-card"><figcaption class="code-head"><span class="code-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>TypeScript</span></span><span class="code-head-r"><button type="button" class="copy-btn" data-copy aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/></svg></button></span></figcaption><div class="code-pane" data-pane="0"><pre><code class="hljs language-typescript">



<span class="hljs-keyword">const</span> users = <span class="hljs-title function_">pgTable</span>(<span class="hljs-string">&#x27;users&#x27;</span>, {
	<span class="hljs-attr">id</span>: <span class="hljs-title function_">serial</span>().<span class="hljs-title function_">primaryKey</span>(),
	<span class="hljs-attr">name</span>: <span class="hljs-title function_">text</span>().<span class="hljs-title function_">notNull</span>(),
	<span class="hljs-attr">email</span>: <span class="hljs-title function_">text</span>().<span class="hljs-title function_">notNull</span>(),
	<span class="hljs-attr">role</span>: <span class="hljs-title function_">text</span>({ <span class="hljs-attr">enum</span>: [<span class="hljs-string">&#x27;admin&#x27;</span>, <span class="hljs-string">&#x27;user&#x27;</span>] }).<span class="hljs-title function_">notNull</span>(),
	<span class="hljs-attr">createdAt</span>: <span class="hljs-title function_">timestamp</span>(<span class="hljs-string">&#x27;created_at&#x27;</span>).<span class="hljs-title function_">notNull</span>().<span class="hljs-title function_">defaultNow</span>(),
});

<span class="hljs-comment">// Schema for inserting a user - can be used to validate API requests</span>
<span class="hljs-keyword">const</span> <span class="hljs-title class_">UserInsert</span> = <span class="hljs-title function_">createInsertSchema</span>(users);

<span class="hljs-comment">// Schema for updating a user - can be used to validate API requests</span>
<span class="hljs-keyword">const</span> <span class="hljs-title class_">UserUpdate</span> = <span class="hljs-title function_">createUpdateSchema</span>(users);

<span class="hljs-comment">// Schema for selecting a user - can be used to validate API responses</span>
<span class="hljs-keyword">const</span> <span class="hljs-title class_">UserSelect</span> = <span class="hljs-title function_">createSelectSchema</span>(users);

<span class="hljs-comment">// Overriding the fields</span>
<span class="hljs-keyword">const</span> <span class="hljs-title class_">UserInsert</span> = <span class="hljs-title function_">createInsertSchema</span>(users, {
	<span class="hljs-attr">role</span>: <span class="hljs-title class_">Schema</span>.<span class="hljs-property">String</span>,
});

<span class="hljs-comment">// Refining the fields - useful if you want to change the fields before they become nullable/optional in the final schema</span>
<span class="hljs-keyword">const</span> <span class="hljs-title class_">UserInsert</span> = <span class="hljs-title function_">createInsertSchema</span>(users, {
	<span class="hljs-attr">id</span>: <span class="hljs-function">(<span class="hljs-params">schema</span>) =&gt;</span> schema.<span class="hljs-title function_">check</span>(<span class="hljs-title class_">Schema</span>.<span class="hljs-title function_">isGreaterThanOrEqualTo</span>(<span class="hljs-number">0</span>)),
	<span class="hljs-attr">role</span>: <span class="hljs-title class_">Schema</span>.<span class="hljs-property">String</span>,
});

<span class="hljs-comment">// Usage</span>
<span class="hljs-keyword">const</span> program = <span class="hljs-title class_">Effect</span>.<span class="hljs-title function_">gen</span>(<span class="hljs-keyword">function</span>*() {
	<span class="hljs-keyword">const</span> parsedUser = <span class="hljs-keyword">yield</span>* <span class="hljs-title class_">Schema</span>.<span class="hljs-title function_">decodeUnknownEffect</span>(<span class="hljs-title class_">UserInsert</span>)({
		<span class="hljs-attr">name</span>: <span class="hljs-string">&#x27;John Doe&#x27;</span>,
		<span class="hljs-attr">email</span>: <span class="hljs-string">&#x27;johndoe@test.com&#x27;</span>,
		<span class="hljs-attr">role</span>: <span class="hljs-string">&#x27;admin&#x27;</span>,
	});
});</code></pre></div></figure>
