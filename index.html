<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevDocs — Programming Documentation</title>
<meta name="description" content="Read programming documentation offline with a study progress tracker.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DevDocs">
<script>
  // Apply saved appearance before first paint (no flash). Migrates v1 settings.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('devdocs.settings.v2') || 'null');
      if (!s) {
        var v1 = JSON.parse(localStorage.getItem('devdocs.settings.v1') || '{}');
        s = { theme: v1.theme || 'auto', lang: 'fa', density: 'comfortable',
              fontSize: { small: 1, normal: 2, large: 3 }[v1.fontSize] != null ? { small: 1, normal: 2, large: 3 }[v1.fontSize] : 2 };
      }
      var t = s.theme || 'auto';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      var el = document.documentElement;
      el.dataset.theme = dark ? 'dark' : 'light';
      el.dataset.themeMode = t;
      el.dataset.fontsize = String(s.fontSize != null ? s.fontSize : 2);
      el.dataset.density = s.density || 'comfortable';
      if (s.lang === 'en') { el.lang = 'en'; el.dir = 'ltr'; }
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Main navigation"></aside>
  <main id="view" tabindex="-1"></main>
</div>

<nav id="tabbar" aria-label="Main navigation">
  <div class="tab-capsule" role="tablist"></div>
  <button id="search-btn" class="search-circle" type="button" aria-label="Search">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2.1"/><path d="M15.8 15.8 21 21" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
  </button>
</nav>

<div id="read-progress" aria-hidden="true"><span></span></div>
<div id="tts-bar" hidden></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
